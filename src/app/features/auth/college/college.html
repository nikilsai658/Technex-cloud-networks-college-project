<div class="main-container">
    <div class="college-card">
        <app-logo></app-logo>
        <h1 class="companyname">Technex Cloud Networks</h1>
        <span class="companyname">Pvt Ltd</span>
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
            <p-floatlabel variant="on">
                <p-select
                    [options]="colleges"
                    formControlName="college"
                    optionLabel="name"
                    [filter]="true"
                    filterBy="name"
                    [showClear]="true"
                    inputId="college"
                    class="country-select">
                </p-select>
                <label for="college">Select a College</label>
            </p-floatlabel>

            <p-button label="Go" type="submit" styleClass="go-btn"></p-button>
        </form>
    </div>
</div>
