<div class="login">
     <app-logo></app-logo>
    <h1 class="companyname">Technex Cloud Networks </h1>
    <span class="companyname">Pvt Ltd</span>
   <form class="form" [formGroup]="Form" (ngSubmit)="onSubmit()">

    <p-floatlabel>
        <input
            pInputText
            formControlName="userNameOrEmail"
            id="on_label"
            name="email"
            autocomplete="off" />
        <label for="on_label" class="p-floatlabel">Username or Email</label>
    </p-floatlabel>
    <p-floatlabel>
        <p-password
            name="password"
            formControlName="password"
            inputStyleClass="custom-password"
            inputId="over_label"
            [feedback]="false"
            [toggleMask]="true" 
            autocomplete="off">
        </p-password>
        <label for="over_label" class="p-floatlabel">Password</label>
    </p-floatlabel>

    <p-button label="Login" type="submit"></p-button>
</form>
<div class="f">
    <div><a routerLink="/auth/forgot-password" class="forgot">
  forgot password?
</a></div>
<div> &nbsp;&nbsp;&nbsp;<a routerLink="/auth/college" class="forgot">select college
</a></div>
</div>
</div>
