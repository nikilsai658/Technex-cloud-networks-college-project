<div class="auth-page">
    <div class="auth-card">
        <app-logo></app-logo>
        <h1 class="companyname">Technex Cloud Networks</h1>
        <span class="companyname">Pvt Ltd</span>

        <form class="auth-form" [formGroup]="Form" (ngSubmit)="onSubmit()">
            <div class="auth-heading">
                <h2>Reset password</h2>
                <p>Choose a new password for your account</p>
            </div>

            <div class="auth-field">
                <p-floatlabel variant="on">
                    <p-password
                        name="newPassword"
                        formControlName="newPassword"
                        inputId="new_password"
                        [feedback]="false"
                        [toggleMask]="true"
                        autocomplete="off">
                    </p-password>
                    <label for="new_password">New Password</label>
                </p-floatlabel>
                <small class="field-error" *ngIf="Form.get('newPassword')?.invalid && Form.get('newPassword')?.touched">
                    {{ Form.get('newPassword') | fieldError:'New password' }}
                </small>
            </div>

            <div class="auth-field">
                <p-floatlabel variant="on">
                    <p-password
                        name="confirmPassword"
                        formControlName="confirmPassword"
                        inputId="confirm_password"
                        [feedback]="false"
                        [toggleMask]="true"
                        autocomplete="off">
                    </p-password>
                    <label for="confirm_password">Confirm Password</label>
                </p-floatlabel>
                <small class="field-error" *ngIf="Form.get('confirmPassword')?.invalid && Form.get('confirmPassword')?.touched">
                    {{ Form.get('confirmPassword') | fieldError:'Confirm password' }}
                </small>
                <small class="field-error" *ngIf="Form.errors?.['passwordMismatch'] && Form.get('confirmPassword')?.touched">
                    Passwords do not match
                </small>
            </div>

            <p-button label="Submit" type="submit"></p-button>

            <p *ngIf="message" class="auth-message" [class.auth-message--success]="messageType === 'success'">
                {{ message }}
            </p>
        </form>
    </div>
</div>
