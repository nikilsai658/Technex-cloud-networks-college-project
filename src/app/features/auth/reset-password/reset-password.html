<div class="resetpassword">
     <app-logo></app-logo>
    <h1 class="companyname">Technex Cloud Networks </h1>
    <span class="companyname">Pvt Ltd</span>
   <form class="form" [formGroup]="Form" (ngSubmit)="onSubmit()">
    <p-floatlabel>
         <p-password
            name="password"
            formControlName="newPassword"
            inputStyleClass="custom-password"
            inputId="over_label"
            [feedback]="false"
            [toggleMask]="true" 
            autocomplete="off">
        </p-password>
        <label for="over_label" class="p-floatlabel">New Password</label>
    </p-floatlabel>
    <p-floatlabel>
        <p-password
            name="password"
            formControlName="confirmPassword"
            inputStyleClass="custom-password"
            inputId="over_label"
            [feedback]="false"
            [toggleMask]="true" 
            autocomplete="off">
        </p-password>
        <label for="over_label" class="p-floatlabel">Confirm Password</label>
    </p-floatlabel>

    <p-button label="submit" type="submit"></p-button>
</form>
</div>
