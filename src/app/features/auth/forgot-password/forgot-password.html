<div class="auth-page">
    <div class="auth-card">
        <app-logo></app-logo>
        <h1 class="companyname">Technex Cloud Networks</h1>
        <span class="companyname">Pvt Ltd</span>

        <form class="auth-form" [formGroup]="Form" (ngSubmit)="OnSubmit()">
            <div class="auth-heading">
                <h2>Forgot password?</h2>
                <p>Enter your email and we'll send you a reset link</p>
            </div>

            <div class="auth-field">
                <p-floatlabel variant="on">
                    <input
                        pInputText
                        id="on_label"
                        name="email"
                        type="email"
                        formControlName="email"
                        autocomplete="off" />
                    <label for="on_label">Email</label>
                </p-floatlabel>
                <small class="field-error" *ngIf="Form.get('email')?.invalid && Form.get('email')?.touched">
                    {{ Form.get('email') | fieldError:'Email' }}
                </small>
            </div>

            <p-button label="Reset Password" type="submit"></p-button>

            <p *ngIf="message" class="auth-message" [class.auth-message--success]="messageType === 'success'">
                {{ message }}
            </p>
        </form>

        <div class="auth-links auth-links--center">
            <a routerLink="/auth/login" class="auth-link">← Back to Login</a>
        </div>
    </div>
</div>
