
<div class="login">
     <app-logo></app-logo>
    <h1 class="companyname">Technex Cloud Networks </h1>
    <span class="companyname">Pvt Ltd</span>
   <form class="form" [formGroup]="Form" (ngSubmit)="OnSubmit()">
    <p-floatlabel>
        <input
            pInputText
            id="on_label"
            name="email"
            formControlName="email"
            autocomplete="off" />
        <label for="on_label" class="p-floatlabel"> Email</label>
    </p-floatlabel>
    <p-button label="Reset Password" type="submit"></p-button>
</form>
<div><a routerLink="/auth/login" class="back">Back to Login</a></div>
</div>
