
<div class="max-w-4xl mx-auto pt-3">

  <!-- Header -->
  <div class="mb-8">

    <div class="flex items-center gap-3 mb-2">

      <!-- Icon -->
      <div
        class="w-11 h-11 rounded-xl
               bg-cyan-100
               flex items-center justify-center">

        <svg
          class="w-6 h-6 text-cyan-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 20h9">
          </path>

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1-1-4L16.5 3.5z">
          </path>

        </svg>

      </div>

      <div>
        <h1 class="text-3xl font-bold text-gray-800">
          Raise Support Ticket
        </h1>

        <p class="text-gray-500 mt-1">
          Describe your issue and our support team will assist you.
        </p>
      </div>

    </div>

  </div>


  <!-- ========================================= -->
  <!-- Ticket Form -->
  <!-- ========================================= -->

  <form
    [formGroup]="ticketForm"
    (ngSubmit)="submit()"
    class="bg-white rounded-2xl shadow-sm
           border border-gray-100
           p-6 md:p-8">


    <!-- Form Title -->
    <div class="mb-7 pb-5 border-b border-gray-100">

      <h2 class="text-lg font-semibold text-gray-800">
        Create New Ticket
      </h2>

      <p class="text-sm text-gray-500 mt-1">
        Please provide the details of your issue.
      </p>

    </div>


    <!-- ========================================= -->
    <!-- Subject -->
    <!-- ========================================= -->

    <div class="mb-6">

      <label
        class="block text-sm font-semibold text-gray-700 mb-2">

        Subject
        <span class="text-red-500">*</span>

      </label>

      <input
        type="text"
        formControlName="subject"
        placeholder="Enter subject"
        class="w-full rounded-lg
               border border-gray-300
               px-4 py-3
               text-gray-700
               placeholder-gray-400
               focus:outline-none
               focus:ring-2
               focus:ring-cyan-500
               focus:border-cyan-500
               transition">

      <p
        *ngIf="
          ticketForm.get('subject')?.touched &&
          ticketForm.get('subject')?.invalid
        "
        class="text-red-500 text-sm mt-2">

        Subject is required.

      </p>

    </div>


    <!-- ========================================= -->
    <!-- Description -->
    <!-- ========================================= -->

    <div class="mb-8">

      <label
        class="block text-sm font-semibold text-gray-700 mb-2">

        Description
        <span class="text-red-500">*</span>

      </label>

      <textarea
        rows="6"
        formControlName="description"
        placeholder="Describe your problem..."
        class="w-full rounded-lg
               border border-gray-300
               px-4 py-3
               text-gray-700
               placeholder-gray-400
               resize-none
               focus:outline-none
               focus:ring-2
               focus:ring-cyan-500
               focus:border-cyan-500
               transition"></textarea>

      <p
        *ngIf="
          ticketForm.get('description')?.touched &&
          ticketForm.get('description')?.invalid
        "
        class="text-red-500 text-sm mt-2">

        Description is required.

      </p>

    </div>


    <!-- ========================================= -->
    <!-- Buttons -->
    <!-- ========================================= -->

    <div
      class="flex flex-col sm:flex-row
             sm:justify-end
             items-stretch sm:items-center
             gap-3">


      <!-- My Tickets -->
      <button
        type="button"
        (click)="this.router.navigate(['/main/mytickets'])"
        class="group inline-flex
               items-center justify-center
               gap-2
               px-6 py-3
               rounded-lg
               border border-cyan-600
               bg-white
               text-cyan-700
               font-semibold
               hover:bg-cyan-50
               hover:shadow-sm
               transition-all duration-200">

        <!-- Ticket Icon -->
        <svg
          class="w-5 h-5
                 group-hover:scale-110
                 transition-transform"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5h6a2 2 0 012 2v10a2 2 0 01-2 2H9a2 2 0 01-2-2V7a2 2 0 012-2z">
          </path>

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 9h6M9 13h6M9 17h3">
          </path>

        </svg>

        My Tickets

      </button>


      <!-- Reset -->
      <button
        type="reset"
        class="px-6 py-3
               rounded-lg
               border border-gray-300
               text-gray-700
               font-medium
               hover:bg-gray-100
               transition">

        Reset

      </button>


      <!-- Raise Ticket -->
      <button
        type="submit"
        [disabled]="loading"
        class="inline-flex
               items-center
               justify-center
               px-6 py-3
               rounded-lg
               bg-cyan-600
               hover:bg-cyan-700
               text-white
               font-semibold
               shadow-sm
               disabled:opacity-50
               disabled:cursor-not-allowed
               transition">

        <!-- Normal -->
        <span *ngIf="!loading">
          Raise Ticket
        </span>


        <!-- Loading -->
        <span
          *ngIf="loading"
          class="flex items-center gap-2">

          <svg
            class="animate-spin
                   w-5 h-5"
            fill="none"
            viewBox="0 0 24 24">

            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4">
            </circle>

            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
            </path>

          </svg>

          Raising...

        </span>

      </button>

    </div>

  </form>

</div>
