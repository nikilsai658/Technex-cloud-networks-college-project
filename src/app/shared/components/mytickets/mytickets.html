<!-- ===================================================== -->
<!-- PAGE HEADER -->
<!-- ===================================================== -->

<div class="mb-6">

  <h1
    class="text-2xl sm:text-3xl
           font-bold
           text-gray-900">

    My Tickets

  </h1>

  <p
    class="text-sm
           text-gray-500
           mt-1">

    View your raised support tickets

  </p>

</div>


<!-- ===================================================== -->
<!-- LOADING -->
<!-- ===================================================== -->

<div
  *ngIf="loading"
  class="flex justify-center py-12">

  <div
    class="w-8 h-8
           border-4
           border-gray-200
           border-t-cyan-600
           rounded-full
           animate-spin">
  </div>

</div>


<!-- ===================================================== -->
<!-- ERROR -->
<!-- ===================================================== -->

<div
  *ngIf="!loading && errorMessage"
  class="p-4
         rounded-xl
         bg-red-50
         border border-red-200
         text-red-600">

  {{ errorMessage }}

  <button
    type="button"
    (click)="getMyTickets()"
    class="ml-3
           font-semibold
           underline">

    Retry

  </button>

</div>


<!-- ===================================================== -->
<!-- NO TICKETS -->
<!-- ===================================================== -->

<div
  *ngIf="
    !loading &&
    !errorMessage &&
    tickets.length === 0
  "
  class="bg-white
         rounded-xl
         border border-gray-200
         p-10
         text-center">

  <div
    class="w-14 h-14
           mx-auto
           rounded-full
           bg-cyan-50
           flex items-center
           justify-center
           text-cyan-600
           text-2xl">

    🎫

  </div>

  <h2
    class="mt-4
           text-lg
           font-semibold
           text-gray-800">

    No tickets found

  </h2>

  <p
    class="mt-1
           text-sm
           text-gray-500">

    You haven't raised any tickets yet.

  </p>

  <button
    type="button"
    routerLink="/main/ticket"
    class="mt-5
           px-5 py-2.5
           rounded-lg
           bg-cyan-600
           text-white
           text-sm
           font-semibold
           hover:bg-cyan-700
           transition">

    Raise Your First Ticket

  </button>

</div>


<!-- ===================================================== -->
<!-- TICKET LIST -->
<!-- ===================================================== -->

<div
  *ngIf="
    !loading &&
    !errorMessage &&
    tickets.length > 0
  "
  class="space-y-5">


  <!-- ================================================= -->
  <!-- TICKET CARD -->
  <!-- ================================================= -->

  <div
    *ngFor="let ticket of tickets"
    class="bg-white
           rounded-xl
           border border-gray-200
           p-5 sm:p-7
           shadow-sm
           hover:shadow-md
           hover:border-cyan-200
           transition">


    <!-- Main Row -->

    <div
      class="flex flex-col
             sm:flex-row
             sm:items-start
             sm:justify-between
             gap-5">


      <!-- ============================================= -->
      <!-- TICKET INFORMATION -->
      <!-- ============================================= -->

      <div
        class="flex-1
               min-w-0">


        <!-- Subject + Status -->

        <div
          class="flex flex-wrap
                 items-center
                 gap-3">


          <!-- Subject -->

          <h3
            class="text-lg
                   sm:text-xl
                   font-semibold
                   text-gray-900">

            {{ ticket.subject }}

          </h3>


          <!-- Status -->

          <span
            class="px-3 py-1
                   rounded-full
                   text-xs
                   font-semibold"
            [ngClass]="{

              'bg-blue-50 text-blue-700':
                ticket.status?.toLowerCase() === 'open',

              'bg-yellow-50 text-yellow-700':
                ticket.status?.toLowerCase() === 'pending',

              'bg-green-50 text-green-700':
                ticket.status?.toLowerCase() === 'resolved',

              'bg-gray-100 text-gray-600':
                ticket.status?.toLowerCase() === 'closed'

            }">

            {{ ticket.status || 'Open' }}

          </span>

        </div>


        <!-- Ticket ID -->

        <p
          class="text-sm
                 text-gray-500
                 mt-2">

          Ticket #{{ ticket.id }}

        </p>


        <!-- Description -->

        <p
          class="text-sm
                 text-gray-600
                 mt-4
                 leading-relaxed">

          {{ ticket.description }}

        </p>


        <!-- Created Date -->

        <p
          *ngIf="ticket.createdAt"
          class="text-xs
                 text-gray-400
                 mt-5">

          Created:
          {{ ticket.createdAt | date:'dd MMM yyyy, hh:mm a' }}

        </p>

      </div>


      <!-- ============================================= -->
      <!-- VIEW TICKET BUTTON -->
      <!-- ============================================= -->

      <div
        class="shrink-0">


        <!-- Open / Pending / Resolved -->

        <button
          *ngIf="
            ticket.status?.toLowerCase() !== 'closed'
          "
          type="button"
          (click)="openTicket(ticket.id)"
          class="w-full sm:w-auto
                 min-w-[95px]
                 px-5 py-3
                 rounded-lg
                 bg-cyan-600
                 text-white
                 text-sm
                 font-semibold
                 hover:bg-cyan-700
                 active:bg-cyan-800
                 transition
                 shadow-sm">

          Reply

        </button>


        <!-- Closed -->

        <button
          *ngIf="
            ticket.status?.toLowerCase() === 'closed'
          "
          type="button"
          (click)="openTicket(ticket.id)"
          class="w-full sm:w-auto
                 min-w-[95px]
                 px-5 py-3
                 rounded-lg
                 border border-gray-200
                 bg-gray-50
                 text-gray-600
                 text-sm
                 font-semibold
                 hover:bg-gray-100
                 transition">

          View Ticket

        </button>

      </div>

    </div>

  </div>

</div>
