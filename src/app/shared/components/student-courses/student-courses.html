<div class="courses-page">

  <!-- Header -->
  <div class="courses-header">

    <div class="courses-header-content">
      <h2 class="courses-title">
        My Courses
      </h2>

      <p class="courses-subtitle">
        Explore your assigned courses and enrolled curriculum modules
      </p>
    </div>

    <div class="courses-count">
      {{ courses.length }} Courses
    </div>

  </div>


  <!-- Loading -->
  <div *ngIf="loading" class="courses-grid-loading">

    <div *ngFor="let x of [1,2,3,4]"
         class="course-skeleton">
    </div>

  </div>


  <!-- No Data -->
  <div *ngIf="!loading && courses.length == 0"
       class="no-courses">

    <h3 class="no-courses-title">
      No Courses Available
    </h3>

    <p class="no-courses-text">
      Courses will appear here after they are assigned.
    </p>

  </div>


  <!-- Courses -->
  <div *ngIf="!loading && courses.length > 0"
       class="courses-grid">

    <div *ngFor="let item of courses"
         class="course-card">

      <!-- Top / Icon -->
      <div class="course-card-header">

        <div class="course-card-icon">
          <span>🕮</span>
        </div>

      </div>


      <!-- Body -->
      <div class="course-card-body">

        <h3 class="course-name">
          {{ item.courseName }}
        </h3>

        <p class="course-description">
          {{ item.description }}
        </p>


        <!-- Information -->
        <div class="course-info">

          <div class="course-info-row">

            <span class="course-info-label">
              Year
            </span>

            <span class="course-info-value">
              {{ item.year }}
            </span>

          </div>


          <div class="course-info-row">

            <span class="course-info-label">
              Semester
            </span>

            <span class="course-info-value">
              {{ item.semester }}
            </span>

          </div>

        </div>


        <!-- Button -->
        <button
          (click)="view(item.courseId)"
          class="view-course-btn">

          View Course

        </button>

      </div>

    </div>

  </div>

</div>
