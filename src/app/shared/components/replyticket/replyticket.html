<div class="min-h-screen bg-gray-50 p-4 md:p-6">

  <!-- Page Container -->
  <div
    class="mx-auto max-w-5xl overflow-hidden
           rounded-xl border border-gray-200
           bg-white shadow-sm">


    <!-- ====================================== -->
    <!-- HEADER -->
    <!-- ====================================== -->

    <div
      class="flex items-center justify-between
             border-b border-gray-200
             bg-white px-5 py-5">


      <!-- Title -->
      <div>

        <h1
          class="text-xl font-semibold
                 text-gray-800">

          Conversation

        </h1>

        <p
          class="mt-1 text-sm text-gray-500">

          Chat with the support team

        </p>

      </div>


      <!-- Refresh -->
      <button
        type="button"
        (click)="refresh()"
        [disabled]="messagesLoading"
        class="flex items-center gap-1.5
               rounded-lg border
               border-gray-200
               bg-white px-4 py-2
               text-sm text-gray-600
               transition
               hover:bg-gray-50
               disabled:cursor-not-allowed
               disabled:opacity-50">

        <span class="text-base">
          ↻
        </span>

        Refresh

      </button>

    </div>


    <!-- ====================================== -->
    <!-- CHAT AREA -->
    <!-- ====================================== -->

    <div
      class="chat-messages h-[500px]
             overflow-y-auto bg-gray-50
             px-5 py-5">


      <!-- Loading -->
      <div
        *ngIf="
          messagesLoading &&
          messages.length === 0
        "
        class="flex h-full items-center
               justify-center">

        <div class="text-center">

          <div
            class="mx-auto mb-3 h-7 w-7
                   animate-spin rounded-full
                   border-4 border-gray-200
                   border-t-cyan-500">
          </div>

          <p
            class="text-sm text-gray-500">

            Loading conversation...

          </p>

        </div>

      </div>


      <!-- No Messages -->
      <div
        *ngIf="
          !messagesLoading &&
          messages.length === 0
        "
        class="flex h-full items-center
               justify-center">

        <div class="text-center">

          <div
            class="mx-auto mb-3 flex h-12 w-12
                   items-center justify-center
                   rounded-full bg-gray-100
                   text-xl">

            💬

          </div>

          <p
            class="font-medium text-gray-600">

            No messages yet

          </p>

          <p
            class="mt-1 text-sm text-gray-400">

            Start the conversation below.

          </p>

        </div>

      </div>


      <!-- ==================================== -->
      <!-- MESSAGE LIST -->
      <!-- ==================================== -->

      <div
        *ngIf="messages.length > 0"
        class="space-y-5">


        <!-- Message -->
        <div
          *ngFor="let msg of messages"
          class="flex w-full"
          [ngClass]="{

            'justify-end':
              isMyMessage(msg),

            'justify-start':
              isAdminMessage(msg)

          }">


          <!-- Message Container -->
          <div
            class="max-w-[75%] md:max-w-[60%]">


            <!-- Sender -->
            <div
              class="mb-1 px-1 text-xs
                     text-gray-400"
              [ngClass]="{

                'text-right':
                  isMyMessage(msg),

                'text-left':
                  isAdminMessage(msg)

              }">

              {{ getSenderLabel(msg) }}

            </div>


            <!-- ================================= -->
            <!-- MESSAGE BUBBLE -->
            <!-- ================================= -->

            <div
  class="px-4 py-3 shadow-sm"
  [ngClass]="{
    'rounded-2xl rounded-br-sm bg-cyan-500 text-white':
      isMyMessage(msg),

    'rounded-2xl rounded-bl-sm border border-gray-200 bg-white text-gray-700':
      isAdminMessage(msg)
  }">

  <p
    class="whitespace-pre-wrap break-words text-sm leading-6">
    {{ msg.message }}
  </p>

</div>


            <!-- ================================= -->
            <!-- TIME -->
            <!-- ================================= -->

            <div
              class="mt-1 px-1 text-[11px]
                     text-gray-400"
              [ngClass]="{

                'text-right':
                  isMyMessage(msg),

                'text-left':
                  isAdminMessage(msg)

              }">

              {{ msg.sentAt | date:'hh:mm a' }}

            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- ====================================== -->
    <!-- REPLY INPUT -->
    <!-- ====================================== -->

    <div
      class="border-t border-gray-200
             bg-white px-5 py-5">


      <div
        class="flex items-end gap-3">


        <!-- Textarea -->
        <textarea
          [(ngModel)]="message"
          rows="3"
          maxlength="1000"
          [disabled]="sending"
          placeholder="Write a reply to the support team..."
          (keydown.enter)="sendOnEnter($event)"
          class="min-h-[82px] flex-1
                 resize-none rounded-xl
                 border border-gray-300
                 px-4 py-4 text-sm
                 text-gray-700 outline-none
                 transition
                 placeholder:text-gray-400
                 focus:border-cyan-500
                 focus:ring-2
                 focus:ring-cyan-100
                 disabled:cursor-not-allowed
                 disabled:bg-gray-100">
        </textarea>


        <!-- Send Button -->
        <button
          type="button"
          (click)="send()"
          [disabled]="
            sending ||
            !message.trim() ||
            message.length > maxMessageLength
          "
          class="flex h-[82px]
                 min-w-[140px]
                 items-center justify-center
                 rounded-xl bg-cyan-500
                 px-5 text-sm
                 font-semibold text-white
                 transition
                 hover:bg-cyan-600
                 disabled:cursor-not-allowed
                 disabled:bg-gray-300">


          <!-- Sending -->
          <ng-container
            *ngIf="sending">

            <span
              class="mr-2 h-4 w-4
                     animate-spin rounded-full
                     border-2 border-white
                     border-t-transparent">
            </span>

            Sending...

          </ng-container>


          <!-- Normal -->
          <ng-container
            *ngIf="!sending">

            Send Reply

          </ng-container>

        </button>

      </div>


      <!-- Bottom Information -->
      <div
        class="mt-2 flex items-center
               justify-between">

        <p
          class="text-xs text-gray-400">

          Your reply will be sent to the support team.

        </p>

        <span
          class="text-xs"
          [ngClass]="{

            'text-red-500':
              message.length >= maxMessageLength,

            'text-gray-400':
              message.length < maxMessageLength

          }">

          {{ message.length }}/{{ maxMessageLength }}

        </span>

      </div>

    </div>

  </div>

</div>
