<div class="domains-page">

  <div class="domains-container">

    <!-- Header -->
    <div class="domains-header">

      <div>
        <h1 class="domains-title">
          Domains
        </h1>

        <p class="domains-subtitle">
          Manage college domains
        </p>
      </div>

    </div>


    <!-- Loading -->
    <div
      *ngIf="loading"
      class="domains-loading"
    >
      <div class="loading-text">
        Loading domains...
      </div>
    </div>


    <!-- No Domains -->
    <div
      *ngIf="!loading && domains.length === 0"
      class="empty-domains"
    >

      <div class="empty-icon">
        📚
      </div>

      <h2 class="empty-title">
        No Domains Found
      </h2>

      <p class="empty-description">
        There are no domains available for this college.
      </p>

    </div>


    <!-- Domain Cards -->
    <div
      *ngIf="!loading && domains.length > 0"
      class="domains-grid"
    >

      <div
        *ngFor="let domain of domains"
        class="domain-card"
      >

        <!-- Top -->
        <div class="domain-card-header">

          <div class="domain-info">

            <h2 class="domain-name">
              {{ domain.domainName }}
            </h2>

            <p class="domain-id">
              Domain ID: {{ domain.domainId }}
            </p>

          </div>


          <!-- Status -->
          <span class="domain-status">

            <span class="status-dot"></span>

            Active

          </span>

        </div>


        <!-- Description -->
        <div class="domain-description-wrapper">

          <p class="domain-description">
            {{ domain.description || 'No description available' }}
          </p>

        </div>


        <!-- Students -->
        <div class="students-section">

          <div class="students-content">

            <div class="student-icon">
              <span>🎓</span>
            </div>

            <div class="students-info">

              <p class="students-label">
                TOTAL STUDENTS
              </p>

              <p class="students-count">
                {{ domain.totalStudents }}
              </p>

            </div>

          </div>

        </div>


        <!-- View Button -->
        <button
          type="button"
          (click)="viewDomain(domain)"
          class="view-domain-button"
        >
          View Domain
        </button>

      </div>

    </div>

  </div>

</div>
