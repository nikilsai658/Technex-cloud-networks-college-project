<div *ngIf="auth.hasPermission('VIEW_COLLEGE_DEPARTMENT')" class="p-6">

  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">

    <div>
      <h2 class="text-2xl font-bold text-[#2F3E46]">
        College Department Mapping
      </h2>

      <p class="text-gray-500">
        Manage College & Department Mapping
      </p>
    </div>

  </div>

  <!-- Form -->

  <form
    [formGroup]="collegeDepartmentForm"
    (ngSubmit)="save()"
    class="bg-white shadow rounded-lg p-6 mb-6">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

      <!-- College -->

      <div>

        <label class="block mb-2 font-medium">
          College
        </label>

        <select
          formControlName="collegeName"
          class="w-full border rounded-lg p-3">

          <option value="">Select College</option>

          <option
              *ngFor="let college of colleges; let i = index"
            [value]="college.name">

            {{college.name  }}

          </option>

        </select>

        <small
          class="text-red-500"
          *ngIf="submitted && collegeDepartmentForm.get('collegeName')?.invalid">

          College is required

        </small>

      </div>

      <!-- Department -->

      <div>

        <label class="block mb-2 font-medium">
          Department
        </label>

        <select
          formControlName="departmentName"
          class="w-full border rounded-lg p-3">

          <option value="">Select Department</option>

          <option
           *ngFor="let department of departments; let i = index"
            [value]="department.name">

            {{department.name}}

          </option>

        </select>

        <small
          class="text-red-500"
          *ngIf="submitted && collegeDepartmentForm.get('departmentName')?.invalid">

          Department is required

        </small>

      </div>

    </div>

    <!-- Buttons -->

    <div
      class="flex gap-3 mt-6"
       *ngIf="auth.hasPermission('CREATE_COLLEGE_DEPARTMENT')">

      <button
        type="submit"
        class="bg-[#24c0c5] hover:bg-[#1ca5aa] text-white px-6 py-2 rounded">

        {{editMode ? 'Update Mapping' : 'Save Mapping'}}

      </button>

      <button
        type="button"
        (click)="resetForm()"
        class="bg-gray-500 text-white px-6 py-2 rounded">

        Reset

      </button>

    </div>

  </form>

  <!-- Search -->

  <div class="mb-5">

    <input
      type="text"
      [(ngModel)]="searchText"
      (keyup)="search()"
      [ngModelOptions]="{standalone:true}"
      placeholder="Search..."
      class="w-full md:w-96 border rounded-lg p-3">

  </div>

  <!-- Table -->

  <div class="overflow-x-auto bg-white rounded-lg shadow">

    <table class="min-w-full">

      <thead class="bg-[#2F3E46] text-white">

        <tr>

          <th class="px-4 py-3 text-left">
            #
          </th>

          <th class="px-4 py-3 text-left">
            College
          </th>

          <th class="px-4 py-3 text-left">
            Department
          </th>

          <th
            class="px-4 py-3 text-center"
            *ngIf="true">

            Actions

          </th>

        </tr>

      </thead>

      <tbody>

        <tr
          *ngFor="let item of filteredMappings; let i=index"
          class="border-b hover:bg-gray-50">

          <td class="px-4 py-3">

            {{i+1}}

          </td>

          <td class="px-4 py-3">

            {{item.collegeName}}

          </td>

          <td class="px-4 py-3">

            {{item.departmentName}}

          </td>

          <td
            class="px-4 py-3 text-center"
            *ngIf="auth.hasPermission('VIEW_COLLEGE_DEPARTMENT')">

            <button
              *ngIf="auth.hasPermission('UPDATE_COLLEGE_DEPARTMENT')"
              (click)="edit(item)"
              class="bg-blue-600 text-white px-3 py-1 rounded mr-2">

              Edit

            </button>

            <button
               *ngIf="auth.hasPermission('DELETE_COLLEGE_DEPARTMENT')"
              (click)="delete(item.id)"
              class="bg-red-600 text-white px-3 py-1 rounded">

              Delete

            </button>

          </td>

        </tr>

        <!-- Empty -->

        <tr *ngIf="filteredMappings.length===0 && !loading">

          <td
            colspan="4"
            class="text-center py-8 text-gray-500">

            No Mapping Found

          </td>

        </tr>

        <!-- Loading -->

        <tr *ngIf="loading">

          <td
            colspan="4"
            class="text-center py-8">

            Loading...

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>

<!-- No Permission -->

<ng-template #noPermission>

  <div class="text-center mt-20">

    <h2 class="text-red-600 text-2xl font-bold">

      Access Denied

    </h2>

    <p class="text-gray-500 mt-2">

      You don't have permission to view this page.

    </p>

  </div>

</ng-template>
