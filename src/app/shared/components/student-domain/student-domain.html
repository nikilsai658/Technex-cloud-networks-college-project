<div class="p-6">

    <!-- Header -->

    <div class="flex items-center justify-between mb-6">

        <div>

            <h2 class="text-3xl font-bold text-[#2F3E46]">
                My Domains
            </h2>

            <p class="text-gray-500">
                Explore your learning domains
            </p>

        </div>

        <div
            class="bg-[#24C0C5] text-white px-5 py-2 rounded-full font-semibold shadow">

            {{domain.length}} Domains

        </div>

    </div>

    <!-- Loading -->

    <div *ngIf="loading"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <div
            *ngFor="let x of [1,2,3,4,5,6]"
            class="h-48 rounded-2xl bg-gray-200 animate-pulse">
        </div>

    </div>

    <!-- No Data -->

    <div
        *ngIf="!loading && domain.length==0"
        class="bg-white rounded-xl shadow p-10 text-center">

        <img
            src="https://cdn-icons-png.flaticon.com/512/4076/4076549.png"
            class="w-28 mx-auto mb-4">

        <h3 class="text-xl font-semibold">
            No Domains Available
        </h3>

        <p class="text-gray-500">
            Domains will appear here after they are assigned.
        </p>

    </div>

    <!-- Domain Cards -->

    <div
        *ngIf="!loading && domain.length>0"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

        <div
            *ngFor="let item of domain"
            class="group bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden border hover:border-[#24C0C5]">

            <!-- Top -->

            <div
                class="h-28 bg-gradient-to-r from-[#2F3E46] to-[#24C0C5] flex justify-center items-center">

                <div
                    class="w-16 h-16 rounded-full bg-white flex items-center justify-center shadow-lg">

                    <span class="text-3xl">💻</span>

                </div>

            </div>

            <!-- Content -->

            <div class="p-5">

                <h3
                    class="text-xl font-bold text-[#2F3E46] group-hover:text-[#24C0C5]">

                    {{item.domainName}}

                </h3>

                <p class="text-gray-500 mt-2 min-h-[50px]">

                    {{item.description || 'Start learning this domain and improve your skills.'}}

                </p>

                <div
                    class="mt-5 flex justify-between items-center">

                    <span
                        class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">

                        Active

                    </span>

                    <button (click)="view()"
                        class="bg-[#24C0C5] hover:bg-[#2F3E46] text-white px-4 py-2 rounded-lg transition">

                        View

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
