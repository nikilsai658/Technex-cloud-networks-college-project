<div>

  <!-- Overlay -->
<div
  *ngIf="sidebarOpen"
  class="overlay"
  (click)="toggleSidebar()">
</div>
<aside
    class="sidebar"
    [class.sidebar-open]="sidebarOpen">

    <!-- Fixed Header -->
    <div class="sidebar-header">
        <div class="sidebar-logo">

        <img
          src="../../../../assets/images/logo.jpeg"
          class="company-logo">


      </div>

      <button
        (click)="toggleSidebar()"
        class="close-btn">
        ✕
      </button>
    </div>

    <!-- Scrollable Body -->
    <div class="sidebar-body">

        <nav class="sidebar-nav">

             <a
             *ngIf="this.auth.hasPermission('VIEW_STUDENT_DOMAIN')"
        routerLink="/main/student-domain"
        routerLinkActive="active-link"
        (click)="toggleSidebar()"
        class="nav-link">
        Dashboard

      </a>

      <a
      *ngIf="this.auth.hasPermission('LEADERBOARD_DOMAIN')"
        routerLink="/main/leadership"
        routerLinkActive="active-link"
        (click)="toggleSidebar()"
        class="nav-link">

        Leaderboard

      </a>

      <a
      *ngIf="this.auth.hasPermission('LEADERBOARD_DOMAIN')"
        routerLink="/main/certificate"
        routerLinkActive="active-link"
        (click)="toggleSidebar()"
        class="nav-link">

        Certifications

      </a>

      <a
      *ngIf="this.auth.hasPermission('CREATE_TICKET')"
        routerLink="/main/ticket"
        routerLinkActive="active-link"
        (click)="toggleSidebar()"
        class="nav-link">

       Raise Ticket

      </a>
        <a
        *ngIf="this.auth.hasPermission('VIEW_ALL_TICKETS')"
        routerLink="/main/alltickets"
        routerLinkActive="active-link"
        (click)="toggleSidebar()"
        class="nav-link">

       Tickets

      </a>
      <ng-container *ngIf="visibleManagementLinks as managementItems">

      <!-- Only one management item: show it directly in the offcanvas -->
      <a
        *ngIf="managementItems.length === 1"
        [routerLink]="managementItems[0].route"
        routerLinkActive="active-link"
        (click)="toggleSidebar()"
        class="nav-link">
        {{ managementItems[0].label }}
      </a>

      <!-- Multiple management items: show them grouped under a dropdown -->
      <div class="nav-group" *ngIf="managementItems.length > 1">

        <button
          type="button"
          (click)="toggleManagement()"
          class="nav-link nav-group-toggle">

          <span>Management</span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="chevron-icon"
            [class.rotate-180]="managementOpen"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"/>

          </svg>

        </button>

        <div class="nav-submenu" *ngIf="managementOpen">

          <a
            *ngFor="let link of managementItems"
            [routerLink]="link.route"
            routerLinkActive="active-link"
            (click)="toggleSidebar()"
            class="nav-sublink">
            {{ link.label }}
          </a>

        </div>

      </div>

      </ng-container>
      <ng-container *ngIf="visibleMappingLinks as mappingItems">

      <!-- Only one mapping item: show it directly in the offcanvas -->
      <a
        *ngIf="mappingItems.length === 1"
        [routerLink]="mappingItems[0].route"
        routerLinkActive="active-link"
        (click)="toggleSidebar()"
        class="nav-link">
        {{ mappingItems[0].label }}
      </a>

      <!-- Multiple mapping items: show them grouped under a dropdown -->
      <div class="nav-group" *ngIf="mappingItems.length > 1">

        <button
          type="button"
          (click)="toggleMapping()"
          class="nav-link nav-group-toggle">

          <span>Mapping</span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="chevron-icon"
            [class.rotate-180]="mappingOpen"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"/>

          </svg>

        </button>

        <div class="nav-submenu" *ngIf="mappingOpen">

          <a
            *ngFor="let link of mappingItems"
            [routerLink]="link.route"
            routerLinkActive="active-link"
            (click)="toggleSidebar()"
            class="nav-sublink">
            {{ link.label }}
          </a>

        </div>

      </div>

      </ng-container>
          <a
             *ngIf="auth.hasPermission('UPDATE_STUDENT_ASSIGNMENT')"
            routerLink="/main/student-assignment-scores"
            routerLinkActive="active-link"
            (click)="toggleSidebar()"
            class="nav-link">

            Student Assignment Scores 

          </a>
          <a
             *ngIf="auth.hasPermission('VIEW_SUPERADMIN_COLLEGES')"
            routerLink="/main/superamin-colleges"
            routerLinkActive="active-link"
            (click)="toggleSidebar()"
            class="nav-link">
            Tracking College Student Scores
          </a>
        </nav>

    </div>

  </aside>

  <!-- Header -->

  <header class="main-header">

    <div class="header-container">

      <!-- Left -->

      <div class="header-left">

        <button
          (click)="toggleSidebar()"
          class="menu-btn">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="menu-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"/>

          </svg>

        </button>

        <a routerLink="/main/student-domain">

            <img
          *ngIf="collegeLogo()"
          [src]="'/' + collegeLogo()"
          alt="College Logo"
          class="college-logo"
            />

        </a>

        <div class="divider"></div>

        <a routerLink="/main/student-domain">

          <img
            src="../../../../assets/images/logo.jpeg"
            class="company-logo-small">

        </a>

      </div>

      <!-- Right -->

      <div class="header-right">

        <button
          routerLink="/main/profile"
          class="profile-btn">

          <img
            src="../../assets/images/profile-fill.svg"
            class="profile-icon">

          <span class="username">

            {{ username }}

          </span>

        </button>

        <a
          routerLink="/main/change_password"
          class="change-password-btn"
          title="Change Password">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="change-password-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <rect
              x="4"
              y="11"
              width="16"
              height="9"
              rx="2"
              stroke-width="1.8">
            </rect>

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M8 11V7a4 4 0 0 1 8 0v4">
            </path>

          </svg>

          <span class="change-password-label">Change Password</span>

        </a>

        <a
          (click)="logout()"
          routerLink="/auth/login"
          class="logout-btn">

          Logout

        </a>

      </div>

    </div>

  </header>

</div>
